<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Comuniones | Alexandra Cossins</title>
    <link rel="icon" type="image/png" href="assets/logoNobackground.png">
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
</head>
<body>
    <header class="navbar scrolled">
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:10px;">
                <img src="assets/logoNobackground.png" alt="Alexandra Cossins Logo">
                <span>Alexandra Cossins</span>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="portfolio.html" class="nav-link">Volver al Portfolio</a></li>
                <li>
                    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema" title="Cambiar tema">
                        <i class="fa-solid fa-moon theme-icon-moon"></i>
                        <i class="fa-solid fa-sun theme-icon-sun"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery-header reveal-up active">
            <h1 class="title-serif">Comuniones</h1>
            <p>Recuerdos preciosos de una etapa única.</p>
        </section>

        <section class="gallery-grid">
            <div class="gallery-item reveal-up active" style="--delay: 0.0s;">
                <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=800&q=80" alt="Niños jugando">
                <div class="polaroid-caption"><a href="#">Martina - 9 años</a></div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.1s;">
                <img src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=600&h=800&q=80" alt="Niño vertical">
                <div class="polaroid-caption">Traje marinero</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.2s;">
                <img src="https://images.unsplash.com/photo-1471286174890-9c11241e9e03?auto=format&fit=crop&w=800&q=80" alt="Niños campo">
                <div class="polaroid-caption">Sesión en el campo</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.3s;">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=600&h=800&q=80" alt="Niña retrato">
                <div class="polaroid-caption"><a href="#">Retrato exterior</a></div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.4s;">
                <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=800&q=80" alt="Niña feliz">
                <div class="polaroid-caption">Espontaneidad</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.5s;">
                <img src="https://images.unsplash.com/photo-1491013516836-7db643ee125a?auto=format&fit=crop&w=600&h=900&q=80" alt="Retrato niño">
                <div class="polaroid-caption">Miradas</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.6s;">
                <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&h=600&q=80" alt="Familia">
                <div class="polaroid-caption"><a href="#">Con la familia</a></div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.7s;">
                <img src="https://images.unsplash.com/photo-1506869640319-a1b63fb79146?auto=format&fit=crop&w=600&h=800&q=80" alt="Niño bosque">
                <div class="polaroid-caption">Aventura</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.8s;">
                <img src="https://images.unsplash.com/photo-1503455637927-730bce768f1e?auto=format&fit=crop&w=800&q=80" alt="Niña corriendo">
                <div class="polaroid-caption">Diversión</div>
            </div>
            <div class="gallery-item reveal-up active" style="--delay: 0.9s;">
                <img src="https://images.unsplash.com/photo-1542037104843-398b1a37c4ee?auto=format&fit=crop&w=600&h=800&q=80" alt="Niño elegante">
                <div class="polaroid-caption"><a href="#">Hugo - 10 años</a></div>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
